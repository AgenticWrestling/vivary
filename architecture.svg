<svg viewBox="0 0 980 640" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img">
  <title id="title">VIVARY architecture diagram</title>
  <desc id="desc">A host operating chassis containing a NixOS LXD transport layer with vivary, keeperd, and a single nspawn agent chamber, plus host-side Chrome and MUS audit logs.</desc>

  <defs>
    <marker id="signal-head" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#c8a96b" />
    </marker>
    <pattern id="paper-grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="rgba(200,169,107,0.08)" stroke-width="1"/>
    </pattern>
    <style>
      .boundary { fill: none; stroke-width: 2; }
      .outer-shell { stroke: rgba(200,169,107,0.38); }
      .inner-shell, .container-zone, .ward-zone { stroke: rgba(200,169,107,0.2); }
      .container-zone { fill: rgba(17,25,33,0.18); }
      .ward-zone { fill: rgba(111,153,137,0.08); }
      .diagram-title { fill: #e6d8be; font: 22px 'Cinzel', serif; letter-spacing: 0.04em; }
      .diagram-title.small { font-size: 17px; }
      .diagram-caption, .diagram-box-text { fill: #c6b79a; font: 16px 'Cormorant Garamond', serif; }
      .diagram-box { stroke-width: 1.2; fill: rgba(32,25,20,0.9); }
      .keeper-box, .ctl-box, .audit-box { stroke: rgba(200,169,107,0.55); }
      .ward-box, .chrome-box, .llm-box { stroke: rgba(111,153,137,0.44); }
      .diagram-box-title { fill: #e0c487; font: 20px 'Cinzel', serif; letter-spacing: 0.04em; }
      .signal-line { fill: none; stroke: #c8a96b; stroke-width: 2.2; }
      .signal-line.soft { stroke: rgba(111,153,137,0.8); stroke-dasharray: 8 8; }
      .signal-label { fill: #6f9989; font: 12px 'IBM Plex Mono', monospace; letter-spacing: 0.16em; text-transform: uppercase; }
    </style>
  </defs>

  <rect x="10" y="10" width="960" height="620" rx="24" class="boundary outer-shell"/>
  <rect x="24" y="24" width="932" height="592" rx="18" class="boundary inner-shell"/>
  <rect x="24" y="24" width="932" height="592" rx="18" fill="url(#paper-grid)"/>

  <text x="48" y="58" class="diagram-title">Host Operating Chassis</text>
  <text x="48" y="82" class="diagram-caption">Chrome and audit inspection remain outside the container wall</text>

  <rect x="42" y="112" width="554" height="462" rx="16" class="boundary container-zone"/>
  <text x="68" y="146" class="diagram-title">NixOS LXD Transport Layer</text>
  <text x="68" y="170" class="diagram-caption">Headless, reproducible, narrow by design</text>

  <rect x="74" y="212" width="214" height="104" rx="10" class="diagram-box keeper-box"/>
  <text x="98" y="246" class="diagram-box-title">keeperd</text>
  <text x="98" y="268" class="diagram-box-text">semantic authority</text>
  <text x="98" y="288" class="diagram-box-text">policy, routing, audit</text>

  <rect x="74" y="350" width="186" height="80" rx="10" class="diagram-box ctl-box"/>
  <text x="98" y="382" class="diagram-box-title">vivary</text>
  <text x="98" y="404" class="diagram-box-text">TUI / CLI via keeper.sock</text>

  <rect x="324" y="182" width="238" height="248" rx="14" class="boundary ward-zone"/>
  <text x="348" y="214" class="diagram-title small">nspawn Agent Chamber</text>

  <rect x="350" y="240" width="184" height="56" rx="8" class="diagram-box ward-box"/>
  <text x="372" y="272" class="diagram-box-title">ward</text>
  <text x="372" y="292" class="diagram-box-text">syntax + protocol adapter</text>

  <rect x="350" y="320" width="184" height="50" rx="8" class="diagram-box llm-box"/>
  <text x="372" y="350" class="diagram-box-title">LLM subprocess</text>

  <text x="350" y="402" class="diagram-caption">No raw credentials, no host identity,</text>
  <text x="350" y="422" class="diagram-caption">no unrestricted network egress</text>

  <rect x="644" y="140" width="272" height="126" rx="14" class="diagram-box chrome-box"/>
  <text x="670" y="176" class="diagram-box-title">Headless Chrome</text>
  <text x="670" y="200" class="diagram-box-text">host-side only</text>
  <text x="670" y="222" class="diagram-box-text">isolated profile per agent</text>
  <text x="670" y="244" class="diagram-box-text">keeperd speaks CDP, not the agent</text>

  <rect x="644" y="308" width="272" height="126" rx="14" class="diagram-box audit-box"/>
  <text x="670" y="344" class="diagram-box-title">Audit + MUS Logs</text>
  <text x="670" y="368" class="diagram-box-text">SQLite WAL</text>
  <text x="670" y="390" class="diagram-box-text">decoded by vivary-log</text>
  <text x="670" y="412" class="diagram-box-text">frames, events, denials</text>

  <path d="M260 390 H304 Q322 390 322 344 V282 H324" class="signal-line" marker-end="url(#signal-head)"/>
  <text x="154" y="378" class="signal-label">MUS over Unix socket</text>

  <path d="M288 252 H350" class="signal-line" marker-end="url(#signal-head)"/>
  <text x="292" y="238" class="signal-label">MUS over stdio</text>

  <path d="M562 250 H644" class="signal-line" marker-end="url(#signal-head)"/>
  <text x="566" y="236" class="signal-label">CDP proxy only</text>

  <path d="M288 286 Q318 306 350 336" class="signal-line soft" marker-end="url(#signal-head)"/>
  <text x="118" y="326" class="signal-label">prompt dispatch</text>

  <path d="M288 302 Q480 496 644 372" class="signal-line soft" marker-end="url(#signal-head)"/>
  <text x="438" y="476" class="signal-label">MUS frames and event records</text>
</svg>
