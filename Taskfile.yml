version: '3'

vars:
  BIN_DIR: ./bin
  WORKSPACE: '{{default "." .WORKSPACE}}'
  CLI_ARGS: '{{default "" .CLI_ARGS}}'
  CONTAINER: '{{default "vivary" .CONTAINER}}'
  KEEPERD_WORKSPACE: '{{default "/var/lib/vivary/workspace" .KEEPERD_WORKSPACE}}'
  WEBSITE_DIR: '{{default "website" .WEBSITE_DIR}}'
  PAGES_BRANCH: '{{default "gh-pages" .PAGES_BRANCH}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - go-task --list-all

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  build:
    desc: Build all VIVARY binaries into ./bin
    deps:
      - build:keeperd
      - build:ward
      - build:chromed
      - build:viv
      - build:vivlog
      - build:capwrap
      - build:vivgen

  build:keeperd:
    desc: Build keeperd
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -o {{.BIN_DIR}}/keeperd ./cmd/keeperd

  build:ward:
    desc: Build ward
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -o {{.BIN_DIR}}/ward ./cmd/ward

  build:chromed:
    desc: Build chromed
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -o {{.BIN_DIR}}/chromed ./chromed

  build:viv:
    desc: Build viv CLI
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -o {{.BIN_DIR}}/viv ./cmd/viv

  build:vivlog:
    desc: Build vivlog
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -o {{.BIN_DIR}}/vivlog ./cmd/vivlog

  build:capwrap:
    desc: Build capwrap
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -o {{.BIN_DIR}}/capwrap ./cmd/capwrap

  build:vivgen:
    desc: Build vivgen
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - CGO_ENABLED=0 go build -o {{.BIN_DIR}}/vivgen ./cmd/vivgen

  dev:
    desc: Build binaries and run the Go test suite
    deps:
      - build
      - test

  dev:keeperd:
    desc: Run keeperd against the current workspace
    cmds:
      - go run ./cmd/keeperd --workspace {{.WORKSPACE}}

  dev:viv:
    desc: Run the viv CLI against the local keeper socket
    cmds:
      - go run ./cmd/viv --socket {{.WORKSPACE}}/keeper.sock {{.CLI_ARGS}}

  dev:vivlog:
    desc: Run vivlog against the local audit DB
    cmds:
      - go run ./cmd/vivlog --db {{.WORKSPACE}}/audit.db {{.CLI_ARGS}}

  distro:
    desc: Build the minimal headless LXD base image
    cmds:
      - nix --extra-experimental-features 'nix-command flakes' build .#distrobuild

  distro:runtime:
    desc: Build the LXD runtime image with local VIVARY binaries
    cmds:
      - nix --extra-experimental-features 'nix-command flakes' build .#distrobuild-runtime

  distro:import:
    desc: Build and import the base LXD image
    cmds:
      - ./scripts/distro-lxd.sh import base {{.CLI_ARGS}}

  distro:import:runtime:
    desc: Build and import the runtime LXD image
    cmds:
      - ./scripts/distro-lxd.sh import runtime {{.CLI_ARGS}}

  distro:doctor:
    desc: Diagnose whether LXD runtime launch prerequisites are met
    cmds:
      - ./scripts/check-lxd-access.sh

  distro:chromed:install:
    desc: Install the host chromed systemd unit and binary
    deps:
      - build:chromed
    cmds:
      - sudo install -Dm755 {{.BIN_DIR}}/chromed /usr/local/bin/chromed
      - sudo install -Dm644 ./systemd/chromed@.service /etc/systemd/system/chromed@.service
      - sudo systemctl daemon-reload

  distro:chromed:status:
    desc: Show chromed systemd status for the target container
    cmds:
      - sudo systemctl --no-pager --full status chromed@{{.CONTAINER}}.service

  distro:launch:
    desc: Launch the default runtime LXD container
    cmds:
      - ./scripts/distro-lxd.sh launch vivary-runtime {{.CONTAINER}}

  distro:stop:
    desc: Stop the runtime LXD container and matching chromed host service
    cmds:
      - ./scripts/distro-lxd.sh stop {{.CONTAINER}}

  distro:delete:
    desc: Delete the runtime LXD container and matching chromed host service
    cmds:
      - ./scripts/distro-lxd.sh delete {{.CONTAINER}}

  distro:export:
    desc: Export an LXD image alias to tarballs
    cmds:
      - ./scripts/distro-lxd.sh export {{.CLI_ARGS}}

  distro:push:
    desc: Rebuild and push runtime binaries into an existing LXD container
    deps:
      - build
    cmds:
      - ./scripts/check-lxd-access.sh --check
      - lxc exec {{.CONTAINER}} -- mkdir -p /usr/local/bin
      - lxc exec {{.CONTAINER}} -- sh -lc 'pkill -x keeperd || true'
      - lxc file push {{.BIN_DIR}}/keeperd {{.CONTAINER}}/usr/local/bin/keeperd
      - lxc file push {{.BIN_DIR}}/viv {{.CONTAINER}}/usr/local/bin/viv
      - lxc file push {{.BIN_DIR}}/vivlog {{.CONTAINER}}/usr/local/bin/vivlog
      - lxc file push {{.BIN_DIR}}/ward {{.CONTAINER}}/usr/local/bin/ward
      - lxc file push {{.BIN_DIR}}/capwrap {{.CONTAINER}}/usr/local/bin/capwrap

  distro:restart:keeperd:
    desc: Restart keeperd inside a running LXD container
    cmds:
      - ./scripts/check-lxd-access.sh --check
      - lxc exec {{.CONTAINER}} -- sh -lc 'mkdir -p /var/log/vivary {{.KEEPERD_WORKSPACE}} && pkill -x keeperd || true; KEEPERD_BIN=/usr/local/bin/keeperd; [ -x "$KEEPERD_BIN" ] || KEEPERD_BIN=$(command -v keeperd); nohup "$KEEPERD_BIN" --workspace {{.KEEPERD_WORKSPACE}} >/var/log/vivary/keeperd.log 2>&1 &'

  distro:connect:
    desc: Launch the viv TUI against keeperd inside a running LXD container
    cmds:
      - ./scripts/check-lxd-access.sh --check
      - lxc exec {{.CONTAINER}} -- viv --socket {{.KEEPERD_WORKSPACE}}/keeper.sock tui

  distro:test:browser-e2e:
    desc: Run LXD+chromed browser allow/deny end-to-end test
    cmds:
      - ./scripts/check-lxd-access.sh --check
      - CONTAINER={{.CONTAINER}} KEEPERD_WORKSPACE={{.KEEPERD_WORKSPACE}} ./scripts/e2e-lxd-browser.sh

  distro:push:restart:
    desc: Push runtime binaries and restart keeperd inside the LXD container
    deps:
      - distro:push
    cmds:
      - task: distro:restart:keeperd
        vars:
          CONTAINER: '{{.CONTAINER}}'
          KEEPERD_WORKSPACE: '{{.KEEPERD_WORKSPACE}}'

  website:pages:push:
    desc: Publish ./website to the GitHub Pages branch using git subtree
    cmds:
      - test -d {{.WEBSITE_DIR}}
      - git diff --quiet
      - git diff --cached --quiet
      - git subtree push --prefix {{.WEBSITE_DIR}} origin {{.PAGES_BRANCH}}
