version: '3'

vars:
  BIN_DIR: ./bin
  WORKSPACE: '{{default "." .WORKSPACE}}'
  CLI_ARGS: '{{default "" .CLI_ARGS}}'

tasks:
  default:
    desc: List available tasks
    cmds:
      - go-task --list-all

  test:
    desc: Run the Go test suite
    cmds:
      - go test ./...

  build:
    desc: Build all VIVARY binaries into ./bin
    deps:
      - build:keeperd
      - build:ward
      - build:viv
      - build:vivlog
      - build:cap-cli
      - build:vivgen

  build:keeperd:
    desc: Build keeperd
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/keeperd ./cmd/keeperd

  build:ward:
    desc: Build ward
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/ward ./cmd/ward

  build:viv:
    desc: Build viv CLI
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/viv ./cmd/viv

  build:vivlog:
    desc: Build vivlog
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/vivlog ./cmd/vivlog

  build:cap-cli:
    desc: Build cap-cli
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/cap-cli ./cmd/cap-cli

  build:vivgen:
    desc: Build vivgen
    cmds:
      - mkdir -p {{.BIN_DIR}}
      - go build -o {{.BIN_DIR}}/vivgen ./cmd/vivgen

  dev:
    desc: Build binaries and run the Go test suite
    deps:
      - build
      - test

  dev:keeperd:
    desc: Run keeperd against the current workspace
    cmds:
      - go run ./cmd/keeperd --workspace {{.WORKSPACE}}

  dev:viv:
    desc: Run the viv CLI against the local keeper socket
    cmds:
      - go run ./cmd/viv --socket {{.WORKSPACE}}/keeper.sock {{.CLI_ARGS}}

  dev:vivlog:
    desc: Run vivlog against the local audit DB
    cmds:
      - go run ./cmd/vivlog --db {{.WORKSPACE}}/audit.db {{.CLI_ARGS}}

  distro:
    desc: Build the minimal headless LXD base image
    cmds:
      - nix --extra-experimental-features 'nix-command flakes' build .#distrobuild

  distro:runtime:
    desc: Build the LXD runtime image with local VIVARY binaries
    cmds:
      - nix --extra-experimental-features 'nix-command flakes' build .#distrobuild-runtime

  distro:import:
    desc: Build and import the base LXD image
    cmds:
      - ./scripts/distro-lxd.sh import base {{.CLI_ARGS}}

  distro:import:runtime:
    desc: Build and import the runtime LXD image
    cmds:
      - ./scripts/distro-lxd.sh import runtime {{.CLI_ARGS}}

  distro:export:
    desc: Export an LXD image alias to tarballs
    cmds:
      - ./scripts/distro-lxd.sh export {{.CLI_ARGS}}
